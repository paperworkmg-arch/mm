name: Swap in v2 tracks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v2 zip from release
        run: |
          curl -L -o silver-toffee-v2.zip https://github.com/paperworkmg-arch/mm/releases/download/v2-temp/silver-toffee-v2.zip
          ls -lh silver-toffee-v2.zip
          unzip -l silver-toffee-v2.zip
      - name: Extract and replace five tracks
        run: |
          rm -rf v2extract && mkdir -p v2extract
          unzip -o silver-toffee-v2.zip -d v2extract
          find v2extract -type f | sort
          for f in 01-cream-intro.mp3 02-wytd.mp3 04-money-on-u.mp3 05-beautiful.mp3 06-cream-outro.mp3; do
            src=$(find v2extract -name "$f" | head -n 1)
            if [ -z "$src" ]; then echo "MISSING $f"; exit 1; fi
            echo "Using $src for audio/$f"
            cp "$src" "audio/$f"
          done
          ls -lh audio/
      - name: Commit v2 tracks
        run: |
          rm -rf v2extract silver-toffee-v2.zip
          git config user.name "paperworkmg-arch"
          git config user.email "paperworkmg-arch@users.noreply.github.com"
          git add audio/
          git status --short
          git commit -m "Swap in CREAM I v2 tracks 01, 02, 04, 05, 06" || echo "nothing to commit"
          git push
